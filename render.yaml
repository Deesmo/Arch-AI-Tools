# Render Blueprint — Arch Tools Platform
# https://render.com/docs/blueprint-spec
#
# IMPORTANT: Do NOT delete existing Render projects or services.
# This blueprint creates NEW services alongside existing ones.
# Deploy from a separate branch first.

databases:
  - name: arch-tools-db
    plan: starter  # $7/mo — 1GB, 256MB RAM, daily backups
    databaseName: arch_tools
    region: oregon
    postgresMajorVersion: "16"

services:
  # ─── API Server ───
  - type: web
    name: arch-tools-api
    runtime: node
    plan: starter  # $7/mo — always on, no spin-down
    region: oregon
    rootDir: api
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: https://archtools.dev,https://www.archtools.dev
      - key: DATABASE_URL
        fromDatabase:
          name: arch-tools-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: FREE_MONTHLY_CREDITS
        value: "100"
      - key: RATE_LIMIT_FREE
        value: "60"
      - key: RATE_LIMIT_PRO
        value: "240"
      - key: RATE_LIMIT_BUSINESS
        value: "1200"
      # These must be set manually in Render dashboard:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ─── Web Frontend (Next.js) ───
  - type: web
    name: arch-tools-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE
        value: https://archtools.dev

  # ─── MCP SSE Server ───
  - type: web
    name: arch-tools-mcp
    runtime: node
    plan: starter
    region: oregon
    rootDir: mcp
    buildCommand: npm install && npm run build
    startCommand: npm run start:sse
    healthCheckPath: /health
    envVars:
      - key: ARCH_API_BASE_URL
        value: https://archtools.dev
      - key: MCP_TRANSPORT
        value: sse
      - key: MCP_SSE_PORT
        value: "10000"
      # Set manually — agent API key for the MCP server
      - key: ARCH_API_KEY
        sync: false

  # ─── Monthly Credit Refresh (Cron) ───
  - type: cron
    name: arch-tools-credit-refresh
    runtime: node
    plan: starter
    region: oregon
    rootDir: api
    buildCommand: npm install && npx prisma generate
    schedule: "0 0 1 * *"  # 1st of each month at midnight UTC
    startCommand: npm run refresh-credits
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arch-tools-db
          property: connectionString
      - key: FREE_MONTHLY_CREDITS
        value: "100"
# ─── Daily Usage Rollups + Retention (Cron) ───
  - type: cron
    name: arch-tools-daily-rollup
    runtime: node
    plan: starter
    region: oregon
    rootDir: api
    buildCommand: npm install && npx prisma generate
    schedule: "20 0 * * *"  # daily at 00:20 UTC
    startCommand: npm run rollup-daily
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arch-tools-db
          property: connectionString


  - type: cron
    name: arch-tools-partitions-ensure
    env: node
    plan: starter
    schedule: "30 0 1 * *"
    buildCommand: "cd api && npm ci && npm run build"
    startCommand: "cd api && npm run partitions-ensure"
    envVars:
      - key: NODE_ENV
        value: production
