services:
  - type: web
    name: arch-ai-tools
    runtime: node
    repo: https://github.com/Deesmo/Arch-AI-Tools
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run seed && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
