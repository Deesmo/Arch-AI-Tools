services:
  - type: web
    name: Arch-AI-Tools
    runtime: node
    rootDir: api
    buildCommand: npm install --include=dev --ignore-scripts && chmod +x ./node_modules/.bin/prisma && node ./node_modules/prisma/build/index.js generate && npm run build
    startCommand: node migrate-startup.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.11.1"
