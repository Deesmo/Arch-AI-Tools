name: x402 Payment Gate Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Was hourly — cut to every 90 min (two offset crons) after the July 2026 Actions minute-cap exhaustion (3,932/3,000 free min) killed all CI.
    - cron: '0 0-21/3 * * *'
    - cron: '30 1-22/3 * * *'

jobs:
  x402-gate:
    name: Verify x402 Payment Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for deploy to stabilize
        run: sleep 60
        if: github.event_name == 'push'
      
      - name: Test x402 gate (must return 402, not 200)
        run: |
          echo "Testing x402 payment gate..."
          # Test that an unauthenticated request returns 402. Use the canonical
          # host (archtools.dev): the app 301-redirects the raw *.onrender.com
          # origin, so hitting onrender.com directly returns 301, not the gate.
          # Retry to ride out the brief 502 window while a fresh deploy swaps in.
          STATUS=""
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST https://archtools.dev/v1/tools/generate-hash \
              -H "Content-Type: application/json" \
              -d '{"text":"ci-gate-test"}')
            echo "Attempt $attempt → status $STATUS"
            if [ "$STATUS" = "402" ] || [ "$STATUS" = "200" ]; then
              break
            fi
            echo "  (transient $STATUS — likely deploy rollout; retrying in 20s)"
            sleep 20
          done

          echo "Final response status: $STATUS"
          echo "Response body: $(cat /tmp/response.json)"

          if [ "$STATUS" = "402" ]; then
            echo "✅ x402 gate is WORKING correctly"
            exit 0
          elif [ "$STATUS" = "200" ]; then
            echo "🚨 CRITICAL: x402 gate is BROKEN — returning 200 instead of 402"
            echo "This means unauthenticated requests bypass payment and auth."
            echo "Check X402_SDK_ENABLED env var and x402-sdk.ts middleware."
            exit 1
          else
            echo "⚠️ Service not reachable (status $STATUS) after retries"
            exit 1
          fi
      
      - name: Test health endpoint
        run: |
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            https://archtools.dev/v1/health/x402)
          echo "Health check status: $STATUS"
          cat /tmp/health.json
