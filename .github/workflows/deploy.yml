name: Main build check (Render auto-deploys api/)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate

      - name: TypeScript compilation check
        working-directory: api
        run: npx tsc --noEmit

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Run integration tests
        run: npm run test || true  # Don't block deploy on test failures (tests need DB)

      # No deploy step: the Render service auto-deploys main itself, only when
      # files under its root directory (api/) change. The curl trigger that lived
      # here made every api/ change deploy twice (Render's deploy + this one) and
      # redeployed unchanged code on every web/ or mcp/ merge; each swap is a
      # brief 502 window (seen 2026-11-02, 16:39:56-16:40:09Z).
